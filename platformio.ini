; PlatformIO Project Configuration for Cardputer-Adv FPV Simulator
; Port of EdgeTX Game-Simulator (AlexeyStn) for M5Stack Cardputer-Adv (ESP32-S3FN8)
; Features: Native USB-OTG Host (EdgeTX HID), Low-Latency BLE HID (ELRS Joystick),
;           Internal BMI270 IMU fallback, 60 FPS Color 3D Engine & Betaflight Analog OSD.

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
framework = arduino

; M5Stack Cardputer-Adv uses Stamp-S3A (ESP32-S3FN8): 8MB Flash, no PSRAM, 240MHz
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

upload_speed = 1500000
monitor_speed = 115200

; IMPORTANT: ARDUINO_USB_CDC_ON_BOOT=0 frees the ESP32-S3 internal USB-OTG PHY
; so ESP-IDF usb_host_install() can claim it cleanly for EdgeTX USB HID radios.
; Flashing always works via ROM bootloader (hold G0 while powering on / plugging USB).
build_flags =
    -O2
    -DESP32S3
    -DCARDPUTER_ADV=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -std=gnu++17

build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1

lib_deps =
    https://github.com/m5stack/M5Cardputer.git
    h2zero/NimBLE-Arduino @ ^1.4.3

[env:native]
platform = native
build_flags =
    -std=c++17
    -DNATIVE_BUILD=1
    -Iinclude
build_src_filter =
    +<hid_parser.cpp>
    +<sim_engine.cpp>
    +<renderer.cpp>
    +<betaflight_osd.cpp>
